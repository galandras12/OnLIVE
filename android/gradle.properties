org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Az AGP maga javasolja sync közben: a könyvtár-komponenseket kihagyja a
# függőségi constraintekből, ezzel gyorsul a konfigurációs fázis. Nálunk minden
# verzió fixen a libs.versions.toml-ból jön, tehát ezek a constraintek úgysem
# döntenek el semmit. Ha bármi függőség-feloldási furcsaság lenne, ez az egy sor
# törölhető.
android.dependency.excludeLibraryComponentsFromConstraints=true

# ---------------------------------------------------------------------------
#  A sárga háromszögek a sync-ben — mi tartozik ránk és mi nem
#
#  Az Android Studio sync közben SAJÁT MAGA ad át az AGP-nek olyan
#  `android.*` kapcsolókat, amelyek ebben a fájlban nincsenek benne:
#
#     android.usesSdkInManifest.disallowed=false
#     android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
#     android.enableAppCompileTimeRClass=false
#     android.builtInKotlin=false
#     android.newDsl=false
#     android.r8.optimizedResourceShrinking=false
#     android.defaults.buildfeatures.resvalues=true
#
#  Az AGP ezekre „deprecated, az alapértelmezés már más" figyelmeztetést ír.
#  Mivel nem mi állítjuk be őket, innen nem is lehet kikapcsolni: az IDE
#  kompatibilitási okból injektálja őket, és a következő Studio-verzióval
#  maguktól elmúlnak. A build ettől sikeres.
#
#  Ugyanez igaz az `applicationVariants` / `testVariants` / `unitTestVariants`
#  „obsolete API" figyelmeztetésekre — a mi build szkriptjeink egyiket sem
#  hívják (app/build.gradle.kts, build.gradle.kts, settings.gradle.kts).
#
#  A Kotlin-plugin figyelmeztetése („az org.jetbrains.kotlin.android AGP 9.0 óta
#  nem kell") előre mutat: a beépített Kotlin támogatás AGP 9-cel jön, ahhoz
#  viszont Gradle >= 9.5 kell, a wrapper pedig 9.3.0-n áll. Amíg az eszközlánc
#  nem lép AGP 9-re, a plugin marad.
# ---------------------------------------------------------------------------
