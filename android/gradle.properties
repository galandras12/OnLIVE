org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ---------------------------------------------------------------------------
#  AGP 9 kompatibilitási kapcsolók (1.0.018)
#
#  Ezt a blokkot az Android Studio írta ide, amikor az eszközlánc AGP 9.3.1-re
#  lépett — nem szépészeti beállítások, hanem ezek tartják meg a RÉGI
#  viselkedést az új AGP alatt. A kettő, ami a legfontosabb:
#
#     android.builtInKotlin=false   → maradhat a klasszikus
#                                     `org.jetbrains.kotlin.android` plugin
#     android.newDsl=false          → marad a megszokott `android { }` DSL
#
#  Az AGP mindegyikre „deprecated, az alapértelmezés már más" figyelmeztetést
#  ír a sync-ben. Ezek SÁRGA HÁROMSZÖGEK, nem hibák: a build sikeres. Kivenni
#  őket csak a beépített Kotlin támogatásra való átállással EGYÜTT szabad —
#  addig a törlésük nem tisztogatás, hanem az app fordításának eltörése.
#
#  Az `applicationVariants` / `testVariants` / `unitTestVariants` „obsolete
#  API" figyelmeztetések viszont NEM tőlünk jönnek: a build szkriptjeink
#  egyiket sem hívják (app/build.gradle.kts, build.gradle.kts,
#  settings.gradle.kts).
#
#  Ami 1.0.016-ban még itt állt (`android.dependency.excludeLibraryComponents-
#  FromConstraints=true`), az kikerült: azt az AGP 8.13 javasolta, az AGP 9-es
#  eszközláncban pedig helyette az alábbi `useConstraints` sor áll. A kettőt
#  egyszerre tartani egymásnak feszülő beállítás lenne.
# ---------------------------------------------------------------------------
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
