[versions]
# ---------------------------------------------------------------------------
#  Eszközlánc
#
#  AGP és Gradle EGYÜTT mozog: az AGP 8.13 legalább Gradle 8.13-at kér, ezért a
#  wrapper a 8.14.5-ön áll (gradle/wrapper/gradle-wrapper.properties). Ha az
#  egyiket emeled, a másikat is nézd meg:
#  https://developer.android.com/build/releases/gradle-plugin
#
#  Az AGP 8.5.2 „tested up to compileSdk 34" volt, a projekt viszont 35-öt
#  fordít — ezt a figyelmeztetést szünteti meg a 8.13-ra lépés.
# ---------------------------------------------------------------------------
agp = "8.13.2"
kotlin = "2.3.21"

# ---------------------------------------------------------------------------
#  16 KB-os lapméret (Android 15+)
#
#  Az új eszközök (pl. Galaxy S26) 16 KB-os memórialapokkal futnak, és a
#  natív .so fájloknak ehhez igazítva kell lenniük. A régi verziók nem voltak
#  azok — a telefon „Az alkalmazás nem kompatibilis a 16 kB-os mérettel"
#  párbeszéddel jelezte, felsorolva a hibás könyvtárakat:
#
#    libimage_processing_util_jni.so   → CameraX
#    libdatastore_shared_counter.so    → DataStore
#    libandroidx.graphics.path.so      → Compose (graphics-path)
#    libjingle_peerconnection_so.so    → WebRTC
#
#  Az alábbi verziók mind 16 KB-ra igazított kiadások. Ha valamelyiket
#  visszaléptetnéd, a figyelmeztetés visszatér.
# ---------------------------------------------------------------------------
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
camerax = "1.6.1"
datastore = "1.2.1"
okhttp = "4.12.0"
coroutines = "1.11.0"
# WebRTC Android build (libwebrtc). A csomag org.webrtc.* névtérben publikál.
webrtc = "144.7559.12"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-camera-video = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

webrtc-android = { group = "io.github.webrtc-sdk", name = "android", version.ref = "webrtc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
