# OnLIVE — a projekt Gradle verziója.
#
# A verziót RÖGZÍTJÜK: enélkül az Android Studio azt használná, ami épp nála
# van, és a build gépről gépre más lenne.
#
# A Gradle és az AGP együtt mozog. Az AGP maga ellenőrzi a minimumot
# (VersionCheckPlugin), a jelenlegi állás:
#
#     AGP 8.13.x  →  minimum Gradle 8.13
#     AGP 9.x     →  minimum Gradle 9.5
#
# A projekt AGP-je a gradle/libs.versions.toml-ban van. A mostani 8.13.2-höz
# ez a 9.3.0 bőven megfelel, és a 9.7.0-ra lépés is gond nélkül mehet, ha az
# Android Studio azt ajánlja — AGP-t ahhoz nem kell váltani.
#
# Amit viszont NE tegyél: AGP 9-re lépni Gradle 9.5 alatt. Az AGP a sync
# legelején leáll, mert nem éri el a minimumot.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
