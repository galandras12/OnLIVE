<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnLIVE</title>
<style>
  /*
    Ez az oldal OBS Browser Source-ként fut, ezért:
      - nincs görgetősáv, nincs interaktív elem, nincs kijelölhető szöveg,
      - a háttér ALAPBÓL átlátszó (`?bg=solid` kapcsolja feketére),
      - minden FIX 1920×1080-as vásznon van, amit egyben skálázunk —
        így egy widget koordinátája ugyanoda esik bármilyen ablakméretnél.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    user-select: none; -webkit-user-select: none;
    cursor: none;
  }
  body.solid { background: #0B0D10; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e5e7eb;
  }

  /* A vászon: fix méret, középre igazítva, a viewporthoz skálázva. */
  #stage {
    position: absolute;
    top: 50%; left: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
  }

  .layer { position: absolute; inset: 0; display: none; place-items: center; text-align: center; }
  .layer.active { display: grid; }

  .media { position: absolute; inset: 0; width: 100%; height: 100%; }
  .media.cover { object-fit: cover; }
  .media.contain { object-fit: contain; }

  /* Tartalék szöveg, ha egy slotba nincs feltöltve média. */
  .fallback { position: relative; z-index: 1; padding: 2rem; }
  .label { font-size: 88px; font-weight: 800; letter-spacing: -0.02em; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
  .sub { margin-top: 16px; color: #cbd5e1; font-size: 28px; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .timer { margin-top: 12px; color: #94a3b8; font-size: 32px; font-variant-numeric: tabular-nums; }

  .dot { display: inline-block; width: .55em; height: .55em; border-radius: 50%; margin-right: .3em; }
  #screen-live .dot { background: #ef4444; animation: pulse 1.4s ease-in-out infinite; }
  #screen-intro .dot, #screen-interrupted .dot { background: #f59e0b; }
  #screen-outro .dot { background: #6366f1; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  /* Az élő videó. Fekete háttér CSAK a videó mögött — a vászon többi része
     átlátszó marad, hogy az OBS-ben alá lehessen tenni bármit. */
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
    display: none;
  }
  #video.playing { display: block; }
  #liveFallback { position: relative; z-index: 1; }
  #liveFallback.hidden { display: none; }

  /* Widget-réteg: mindig a képernyők FELETT, abszolút koordinátákkal. */
  #widgets { position: absolute; inset: 0; pointer-events: none; }
  .widget { position: absolute; display: flex; align-items: center; justify-content: center; }
  .widget img { width: 100%; height: 100%; object-fit: contain; }
  /* A beágyazott third-party tartalom sandboxolt iframe-ben fut. */
  .widget iframe { width: 100%; height: 100%; border: 0; background: transparent; }
  .widget .text {
    font-size: 32px; font-weight: 600; line-height: 1.25;
    text-shadow: 0 2px 12px rgba(0,0,0,.7);
    padding: 12px 20px; width: 100%;
  }
  .widget.notification .text {
    background: rgba(11,13,16,.82);
    border-left: 6px solid #e11d48;
    border-radius: 10px;
    text-align: left;
  }

  /* Diagnosztikai jelzések — a nézőnek nem szólnak, csak beállításkor. */
  .badge {
    position: fixed; z-index: 20;
    padding: 6px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 700; letter-spacing: .04em;
  }
  #previewBadge { top: 12px; left: 12px; background: rgba(244,63,94,.9); color: #fff; }
  #statusBadge { bottom: 12px; right: 12px; background: rgba(239,68,68,.9); color: #fff; display: none; }
  body.debug #statusBadge { display: block; }
</style>
</head>
<body>

<div id="stage">

  <div class="layer" id="screen-blank" data-screen="blank"></div>

  <div class="layer" id="screen-intro" data-screen="intro">
    <div class="fallback">
      <div class="label"><span class="dot"></span>Hamarosan kezdünk</div>
      <div class="sub" id="introReason"></div>
    </div>
  </div>

  <div class="layer" id="screen-live" data-screen="live">
    <video id="video" playsinline autoplay muted></video>
    <div class="fallback" id="liveFallback">
      <div class="label"><span class="dot"></span>ÉLŐ</div>
      <div class="timer" id="elapsed"></div>
      <div class="sub" id="playerStatus">Lejátszó indul…</div>
    </div>
  </div>

  <div class="layer" id="screen-interrupted" data-screen="interrupted">
    <div class="fallback">
      <div class="label"><span class="dot"></span>Megszakadt</div>
      <div class="sub" id="interruptedSub">Mindjárt folytatjuk…</div>
    </div>
  </div>

  <div class="layer" id="screen-outro" data-screen="outro">
    <div class="fallback">
      <div class="label"><span class="dot"></span>Köszönjük, hogy velünk voltál!</div>
      <div class="timer" id="outroTimer"></div>
    </div>
  </div>

  <div id="widgets"></div>
</div>

<div class="badge" id="statusBadge">nincs kapcsolat</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const token = params.get('token') ?? '';
  const withToken = (url) => (token ? url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token) : url);

  /** `?preview=<screen>`: rögzített képernyő az admin előnézethez. */
  const previewScreen = params.get('preview');
  const isPreview = Boolean(previewScreen);

  /** `?bg=solid`: fekete háttér (önálló weblejátszóhoz). OBS-ben átlátszó kell. */
  if (params.get('bg') === 'solid') document.body.classList.add('solid');
  /** `?debug=1`: állapotjelzés a sarokban beállításkor. */
  if (params.get('debug') === '1') document.body.classList.add('debug');
  /** `?player=whep|hls`: kézi választás; alapból WHEP, hiba esetén HLS. */
  const forcedPlayer = params.get('player');
  /** `?path=`: melyik stream (alapból a szerver beállítása). */
  const streamPath = params.get('path') ?? window.ONLIVE_STREAM_PATH ?? 'onlive';

  let state = null;
  let media = { slots: {} };
  let overlay = { canvas: { width: 1920, height: 1080 }, widgets: [] };

  // =========================================================================
  //  Vászon-skálázás
  // =========================================================================

  const stage = document.getElementById('stage');

  function fitStage() {
    const { width, height } = overlay.canvas;
    stage.style.width = width + 'px';
    stage.style.height = height + 'px';
    const scale = Math.min(window.innerWidth / width, window.innerHeight / height);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  window.addEventListener('resize', fitStage);

  // =========================================================================
  //  Állapot-képernyők és média (5. szegmens)
  // =========================================================================

  const mediaElements = { intro: null, interrupted: null, outro: null };

  function layerFor(screen) {
    return document.getElementById('screen-' + screen) || document.getElementById('screen-blank');
  }

  function syncMediaElement(slot) {
    const entry = media.slots?.[slot] ?? null;
    const layer = layerFor(slot);
    const existing = mediaElements[slot];

    if (!entry) {
      if (existing) { existing.remove(); mediaElements[slot] = null; }
      return;
    }
    const url = withToken(entry.url);
    if (existing && existing.dataset.url === url) { applyOptions(existing, entry); return; }
    if (existing) existing.remove();

    const el = entry.kind === 'video' ? document.createElement('video') : document.createElement('img');
    el.className = 'media';
    el.dataset.url = url;
    el.src = url;
    if (entry.kind === 'video') {
      el.playsInline = true;
      el.autoplay = false;
      el.preload = 'auto';
      el.controls = false;
    }
    applyOptions(el, entry);
    layer.insertBefore(el, layer.firstChild);
    mediaElements[slot] = el;
  }

  function applyOptions(el, entry) {
    const options = entry.options ?? {};
    el.classList.toggle('cover', options.fit !== 'contain');
    el.classList.toggle('contain', options.fit === 'contain');
    if (el.tagName === 'VIDEO') {
      el.loop = options.loop !== false;
      el.muted = options.muted !== false;
    }
  }

  function syncAllMedia() {
    for (const slot of ['intro', 'interrupted', 'outro']) syncMediaElement(slot);
  }

  function showScreen(screen) {
    for (const layer of document.querySelectorAll('.layer')) {
      const active = layer.dataset.screen === screen;
      layer.classList.toggle('active', active);

      const video = layer.querySelector('video.media');
      if (!video) continue;
      if (active) {
        try { video.currentTime = 0; } catch {}
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    }

    // A lejátszót csak akkor tartjuk életben, amikor tényleg kell:
    // intro/outro alatt fölösleges terhelés és sávszélesség lenne.
    if (screen === 'live') player.ensureStarted();
    else player.stop('nem live képernyő');
  }

  // =========================================================================
  //  Widget-réteg (renderelés; a szerkesztő a 7. szegmensé)
  // =========================================================================

  const widgetLayer = document.getElementById('widgets');

  /**
   * A widgetek renderelése INKREMENTÁLISAN.
   *
   * Miért nem egyszerű újrarajzolás: egy beágyazott chat iframe minden
   * újralétrehozáskor újratöltene — állapotváltáskor elveszne az addigi
   * beszélgetés, és a third-party szkript újra elindulna. Ezért az elemeket
   * megtartjuk, és csak a pozíciót/láthatóságot frissítjük; iframe-et
   * kizárólag akkor cserélünk, ha tényleg megváltozott a forrás.
   */
  const widgetElements = new Map();

  function renderWidgets() {
    const screen = isPreview ? previewScreen : state?.screen;
    const seen = new Set();

    for (const widget of overlay.widgets ?? []) {
      const shouldShow =
        widget.visible && (!widget.screens?.length || widget.screens.includes(screen));

      let entry = widgetElements.get(widget.id);
      const signature = widget.type + '|' + (widget.data?.embedUrl ?? widget.data?.url ?? '') +
        '|' + (widget.data?.text ?? '') + '|' + (widget.data?.color ?? '') + '|' + (widget.data?.fontSize ?? '');

      if (entry && entry.signature !== signature) {
        entry.element.remove();
        entry = null;
      }
      if (!entry) {
        const element = buildWidget(widget);
        if (!element) continue;
        widgetLayer.appendChild(element);
        entry = { element, signature };
        widgetElements.set(widget.id, entry);
      }

      const el = entry.element;
      el.style.left = widget.x + 'px';
      el.style.top = widget.y + 'px';
      el.style.width = widget.width + 'px';
      el.style.height = widget.height + 'px';
      el.style.opacity = widget.opacity ?? 1;
      el.style.zIndex = widget.zIndex ?? 1;
      el.style.display = shouldShow ? 'flex' : 'none';
      seen.add(widget.id);
    }

    // A törölt widgetek elemei is menjenek.
    for (const [id, entry] of widgetElements) {
      if (!seen.has(id)) {
        entry.element.remove();
        widgetElements.delete(id);
      }
    }
  }

  function buildWidget(widget) {
    const el = document.createElement('div');
    el.className = 'widget ' + widget.type;

    if (widget.type === 'logo') {
      if (!widget.data?.url) return null;
      const img = document.createElement('img');
      img.src = withToken(widget.data.url);
      img.alt = '';
      el.appendChild(img);
    } else if (widget.type === 'embed') {
      if (!widget.data?.embedUrl) return null;
      const frame = document.createElement('iframe');
      /*
        BIZTONSÁG: `allow-scripts` van, `allow-same-origin` NINCS.
        Így az iframe átlátszatlan (opaque) origint kap: nem éri el a szülő
        DOM-ját, a localStorage-ot és a sütiket. A kettő EGYÜTT kioltaná a
        sandboxot, ezért soha nem adjuk meg egyszerre.
      */
      frame.setAttribute('sandbox', 'allow-scripts');
      frame.setAttribute('referrerpolicy', 'no-referrer');
      frame.setAttribute('loading', 'eager');
      frame.setAttribute('scrolling', 'no');
      // A beágyazás URL-je a widget saját kulcsát viszi, NEM a lejátszási
      // tokent — így a third-party szkript nem tudja azt kiolvasni.
      frame.src = widget.data.embedUrl;
      el.appendChild(frame);
    } else {
      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = widget.data?.text ?? '';
      if (widget.data?.color) text.style.color = widget.data.color;
      if (widget.data?.fontSize) text.style.fontSize = widget.data.fontSize + 'px';
      if (widget.data?.align) text.style.textAlign = widget.data.align;
      el.appendChild(text);
    }
    return el;
  }

  // =========================================================================
  //  Élő videó: WHEP (alacsony látencia), HLS tartalékkal
  // =========================================================================

  const video = document.getElementById('video');
  const playerStatus = document.getElementById('playerStatus');
  const liveFallback = document.getElementById('liveFallback');

  const player = {
    pc: null,
    hls: null,
    sessionUrl: null,
    mode: null,
    retry: 0,
    timer: null,
    stopped: true,

    setStatus(text, playing) {
      playerStatus.textContent = text;
      video.classList.toggle('playing', Boolean(playing));
      liveFallback.classList.toggle('hidden', Boolean(playing));
      document.getElementById('statusBadge').textContent = text;
    },

    ensureStarted() {
      if (!this.stopped) return;
      this.stopped = false;
      this.retry = 0;
      this.start();
    },

    async start() {
      if (this.stopped) return;
      const mode = forcedPlayer ?? (this.retry >= 3 ? 'hls' : 'whep');
      this.mode = mode;
      this.setStatus(mode === 'whep' ? 'Kapcsolódás (WebRTC)…' : 'Kapcsolódás (HLS)…', false);

      try {
        if (mode === 'whep') await this.startWhep();
        else await this.startHls();
      } catch (error) {
        this.scheduleRetry(error?.message ?? 'ismeretlen hiba');
      }
    },

    /** WHEP: SDP offer a proxynak, answer vissza. ~0,2–0,5 s késleltetés. */
    async startWhep() {
      const pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }],
        bundlePolicy: 'max-bundle',
      });
      this.pc = pc;

      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.addTransceiver('audio', { direction: 'recvonly' });

      const stream = new MediaStream();
      pc.ontrack = (event) => {
        stream.addTrack(event.track);
        video.srcObject = stream;
        video.play().catch(() => {});
      };

      pc.onconnectionstatechange = () => {
        if (pc !== this.pc) return;
        if (pc.connectionState === 'connected') {
          this.retry = 0;
          this.setStatus('Élő (WebRTC)', true);
        } else if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) {
          this.scheduleRetry('a WebRTC kapcsolat megszakadt');
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitForIce(pc, 3000);

      const response = await fetch(withToken('/api/whep/' + encodeURIComponent(streamPath)), {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: pc.localDescription.sdp,
      });
      if (!response.ok) throw new Error('WHEP HTTP ' + response.status);

      this.sessionUrl = response.headers.get('Location');
      const answer = await response.text();
      await pc.setRemoteDescription({ type: 'answer', sdp: answer });
    },

    /** HLS tartalék: nagyobb késleltetés, de átmegy ott is, ahol a WebRTC nem. */
    async startHls() {
      const url = withToken('/api/hls/' + encodeURIComponent(streamPath) + '/index.m3u8');

      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        await video.play().catch(() => {});
        this.setStatus('Élő (HLS)', true);
        return;
      }

      if (!window.Hls) throw new Error('a HLS lejátszó nem töltődött be');
      const hls = new window.Hls({ lowLatencyMode: true, backBufferLength: 10 });
      this.hls = hls;
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {});
        this.retry = 0;
        this.setStatus('Élő (HLS)', true);
      });
      hls.on(window.Hls.Events.ERROR, (_event, data) => {
        if (data.fatal) this.scheduleRetry('HLS hiba: ' + data.details);
      });
    },

    scheduleRetry(reason) {
      if (this.stopped) return;
      this.teardown();
      this.retry += 1;
      // 1 s → 2 s → 4 s … max 10 s. Három sikertelen WHEP után HLS-re váltunk.
      const delay = Math.min(10_000, 1000 * 2 ** Math.min(this.retry - 1, 4));
      this.setStatus(`Újracsatlakozás… (${reason})`, false);
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.start(), delay);
    },

    stop(reason) {
      if (this.stopped) return;
      this.stopped = true;
      clearTimeout(this.timer);
      this.teardown();
      this.setStatus('Lejátszó leállítva' + (reason ? ' — ' + reason : ''), false);
    },

    teardown() {
      if (this.sessionUrl) {
        // A munkamenet lezárása, hogy ne gyűljenek halott olvasók a MediaMTX-ben.
        fetch(this.sessionUrl, { method: 'DELETE', keepalive: true }).catch(() => {});
        this.sessionUrl = null;
      }
      if (this.pc) { try { this.pc.close(); } catch {} this.pc = null; }
      if (this.hls) { try { this.hls.destroy(); } catch {} this.hls = null; }
      video.srcObject = null;
      video.removeAttribute('src');
      video.classList.remove('playing');
    },
  };

  function waitForIce(pc, timeoutMs) {
    if (pc.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise((resolve) => {
      const done = () => { pc.removeEventListener('icegatheringstatechange', check); resolve(); };
      const check = () => { if (pc.iceGatheringState === 'complete') done(); };
      pc.addEventListener('icegatheringstatechange', check);
      setTimeout(done, timeoutMs);
    });
  }

  window.addEventListener('beforeunload', () => player.teardown());

  // =========================================================================
  //  Renderelés és állapot
  // =========================================================================

  function render() {
    if (!state) return;
    showScreen(isPreview ? previewScreen : state.screen);

    const reasons = {
      start: 'Az adás indul, várjuk a képet…',
      interrupted: 'A kapcsolat megszakadt, újraindítjuk…',
      resume: 'Folytatjuk, várjuk a képet…',
    };
    document.getElementById('introReason').textContent = reasons[state.introReason] ?? '';
    document.getElementById('interruptedSub').textContent =
      state.state === 'paused' ? 'Mindjárt folytatjuk…' : 'A kapcsolat helyreállítása folyamatban…';

    renderWidgets();
  }

  function tick() {
    if (!state) return;
    if (state.screen === 'live') {
      const total = Math.floor((state.liveElapsedMs ?? 0) / 1000) + Math.floor((Date.now() - state.at) / 1000);
      document.getElementById('elapsed').textContent =
        String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
    }
    if (state.screen === 'outro' && state.outro?.endsAt) {
      document.getElementById('outroTimer').textContent =
        Math.max(0, Math.ceil((state.outro.endsAt - Date.now()) / 1000)) + ' mp';
    }
  }

  // --- indulás ---------------------------------------------------------------

  fitStage();

  fetch(withToken('/api/media')).then((r) => r.json()).then((manifest) => {
    media = manifest; syncAllMedia(); render();
  }).catch(() => {});

  fetch(withToken('/api/overlay')).then((r) => r.json()).then((manifest) => {
    overlay = manifest; fitStage(); renderWidgets();
  }).catch(() => {});

  if (isPreview) {
    document.body.insertAdjacentHTML('beforeend',
      '<div class="badge" id="previewBadge">Előnézet: ' + previewScreen + '</div>');
    state = { screen: previewScreen, state: previewScreen, introReason: 'start', liveElapsedMs: 0, at: Date.now(), outro: {} };
    render();
  }

  const socket = io({ query: { role: 'live', token } });

  socket.on('onlive:state', (next) => {
    state = next;
    document.getElementById('statusBadge').style.removeProperty('display');
    if (!isPreview) render();
  });

  socket.on('onlive:media', (manifest) => { media = manifest; syncAllMedia(); render(); });

  // Overlay-mozgatás: azonnal látszik, újratöltés nélkül.
  socket.on('onlive:overlay', (manifest) => { overlay = manifest; fitStage(); renderWidgets(); });

  socket.on('disconnect', () => {
    document.getElementById('statusBadge').textContent = 'nincs kapcsolat a vezérlő szerverrel';
  });

  setInterval(tick, 250);
})();
</script>
<script src="/vendor/hls.min.js" defer></script>
</body>
</html>
