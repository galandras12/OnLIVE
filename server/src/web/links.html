<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnLIVE — Linkek</title>
<link rel="stylesheet" href="/admin.css">
<style>
  /*
    Ez az oldal MOBILRA készült: nagy, ujjal is könnyen eltalálható gombok.
    Adás közben a telefonon nyitod meg, és egy koppintással ugrasz a chatre.
  */
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header { padding: 1.5rem 1.25rem .5rem; text-align: center; }
  h1 { margin: 0; font-size: 1.35rem; }
  h1 span { color: var(--accent); }
  .state { margin-top: .35rem; font-size: .85rem; color: var(--muted); }
  main { flex: 1; padding: 1rem 1.25rem 2rem; max-width: 560px; margin: 0 auto; width: 100%; }
  .link {
    display: flex; align-items: center; justify-content: space-between; gap: .75rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-lg);
    padding: 1rem 1.15rem; margin-bottom: .75rem;
    color: var(--text); text-decoration: none; font-size: 1.05rem; font-weight: 600;
  }
  .link:active { background: var(--panel-2); }
  .link .host { font-size: .78rem; font-weight: 400; color: var(--muted); }
  .link .go { color: var(--accent); font-size: 1.2rem; }
  footer { text-align: center; padding: 1rem; color: var(--faint); font-size: .75rem; }
</style>
</head>
<body>

<header>
  <h1><span>OnLIVE</span> — Linkek</h1>
  <div class="state" id="state">…</div>
</header>

<main id="list">
  <div class="empty">Betöltés…</div>
</main>

<footer>Minden link új lapon nyílik meg.</footer>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const escapeHtml = (text) => String(text).replace(/[<>&"]/g, (c) =>
    ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

  fetch('/api/links')
    .then((response) => response.json())
    .then(({ links }) => {
      document.getElementById('list').innerHTML = links.length
        ? links.map((link) => {
            let host = '';
            try { host = new URL(link.url).host; } catch { host = ''; }
            return `<a class="link" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">
              <span>${escapeHtml(link.name)}<br><span class="host">${escapeHtml(host)}</span></span>
              <span class="go">↗</span>
            </a>`;
          }).join('')
        : '<div class="empty">Még nincs beállítva link.</div>';
    })
    .catch(() => {
      document.getElementById('list').innerHTML =
        '<div class="empty">A linkek betöltése nem sikerült.</div>';
    });

  // Az adás állapota — hogy a telefonon is lásd, megy-e éppen.
  const STATE_TEXT = {
    idle: 'nincs adás', intro: 'mindjárt kezdünk', live: '● élő adás',
    reconnecting: 'megszakadt', paused: 'szüneteltetve', outro: 'vége felé', ended: 'vége',
  };
  const socket = io({ query: { role: 'live' } });
  socket.on('onlive:state', (state) => {
    document.getElementById('state').textContent = STATE_TEXT[state.state] ?? state.state;
  });
  socket.on('connect_error', () => {
    document.getElementById('state').textContent = '';
  });
})();
</script>
</body>
</html>
