<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnLIVE — Belépés</title>
<link rel="stylesheet" href="/admin.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; }
  .box { width: min(380px, 92vw); }
  .box h1 { margin: 0 0 .3rem; font-size: 1.6rem; letter-spacing: -.02em; }
  .box h1 span { color: var(--accent); }
  .box p.lead { margin: 0 0 1.2rem; color: var(--muted); font-size: .88rem; }
  form { display: grid; gap: .7rem; }
  .msg { min-height: 1.3em; font-size: .85rem; }
</style>
</head>
<body>

<div class="box card">
  <h1><span>OnLIVE</span></h1>
  <p class="lead">Vezérlőfelület — belépés szükséges.</p>

  <form id="form">
    <input type="password" id="password" placeholder="Admin jelszó" autocomplete="current-password" autofocus>
    <button class="btn wide" type="submit" id="submit">Belépés</button>
  </form>

  <div class="msg" id="message"></div>
</div>

<script>
(() => {
  const form = document.getElementById('form');
  const message = document.getElementById('message');
  const submit = document.getElementById('submit');

  /**
   * Ahová belépés után visszatérünk (pl. ha egy al-oldalról dobott ide).
   *
   * BIZTONSÁG: csak SAJÁT, abszolút útvonal fogadható el. Enélkül egy
   * `?next=javascript:…` link a belépett admin oldalán futtatna kódot, egy
   * `?next=https://…` pedig idegen oldalra irányítana belépés után.
   * A `//` kezdet is tiltott: az protokoll-relatív, tehát külső cím.
   */
  const requested = new URLSearchParams(location.search).get('next') ?? '';
  const next = /^\/(?!\/)/.test(requested) ? requested : '/admin';

  fetch('/api/auth/me')
    .then((r) => r.json())
    .then((me) => {
      if (me.authenticated) location.replace(next);
      if (!me.passwordConfigured) {
        message.innerHTML = '<span class="err">Nincs beállítva admin jelszó. ' +
          'Állítsd be az ONLIVE_ADMIN_PASSWORD_HASH értékét (npm run hash-password).</span>';
      }
    })
    .catch(() => {});

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    submit.disabled = true;
    message.textContent = 'Ellenőrzés…';
    message.className = 'msg';

    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value }),
      });
      const body = await response.json();

      if (response.ok) {
        // A munkamenet HttpOnly sütiben van; a JavaScript csak a CSRF tokent
        // tartja meg, hogy az állapotváltoztató kérésekhez oda tudja adni.
        sessionStorage.setItem('onlive.csrf', body.csrfToken);
        location.replace(next);
        return;
      }

      message.className = 'msg err';
      message.textContent = response.status === 429
        ? body.error
        : body.error + (body.remainingAttempts !== undefined
          ? ` (${body.remainingAttempts} próbálkozás a zárlatig)` : '');
    } catch (error) {
      message.className = 'msg err';
      message.textContent = 'A szerver nem érhető el: ' + error.message;
    } finally {
      submit.disabled = false;
      document.getElementById('password').select();
    }
  });
})();
</script>
</body>
</html>
